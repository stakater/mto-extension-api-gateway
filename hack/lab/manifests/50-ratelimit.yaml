# The rate limit service and its Redis (design §3.1). Lab rates per minute: gold 20, silver 10, any other tier 4.
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: mto-api-gateways }
spec:
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers: [{ name: redis, image: "redis:7.4.1-alpine", ports: [{ containerPort: 6379 }] }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: mto-api-gateways }
spec:
  selector: { app: redis }
  ports: [{ name: tcp-redis, port: 6379, targetPort: 6379 }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: ratelimit-config, namespace: mto-api-gateways }
data:
  config.yaml: |
    domain: mto-api-gateway
    descriptors:
      - key: tenant
        descriptors:
          - key: api
            descriptors:
              - key: tier
                value: gold
                descriptors: [{ key: azp, rate_limit: { unit: minute, requests_per_unit: 20 } }]
              - key: tier
                value: silver
                descriptors: [{ key: azp, rate_limit: { unit: minute, requests_per_unit: 10 } }]
              - key: tier
                descriptors: [{ key: azp, rate_limit: { unit: minute, requests_per_unit: 4 } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ratelimit, namespace: mto-api-gateways }
spec:
  selector: { matchLabels: { app: ratelimit } }
  template:
    metadata: { labels: { app: ratelimit } }
    spec:
      containers:
        - name: ratelimit
          # Multi-arch (amd64, arm64). An amd64-only image runs under emulation on an ARM machine and crashes
          # at random (SIGSEGV), which looks like a fault of the service (G.19 findings, S1).
          image: envoyproxy/ratelimit:5ae0682e@sha256:b95206e32b1a5f824fb06062fbb85bbdfb7f5de54135e92afe8462f22c979681
          command: [/bin/ratelimit]
          env:
            - { name: LOG_LEVEL, value: info }
            - { name: USE_STATSD, value: "false" }
            - { name: REDIS_SOCKET_TYPE, value: tcp }
            - { name: REDIS_TYPE, value: SINGLE }
            - { name: REDIS_URL, value: "redis.mto-api-gateways.svc.cluster.local:6379" }
            - { name: RUNTIME_ROOT, value: /data }
            - { name: RUNTIME_SUBDIRECTORY, value: ratelimit }
            - { name: RUNTIME_WATCH_ROOT, value: "false" }
            - { name: RUNTIME_IGNOREDOTFILES, value: "true" }
            - { name: GRPC_PORT, value: "8081" }
            - { name: DEBUG_PORT, value: "6070" }
          ports: [{ name: grpc, containerPort: 8081 }, { name: debug, containerPort: 6070 }]
          volumeMounts: [{ name: config, mountPath: /data/ratelimit/config, readOnly: true }]
      volumes: [{ name: config, configMap: { name: ratelimit-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: ratelimit, namespace: mto-api-gateways }
spec:
  selector: { app: ratelimit }
  ports:
    - { name: grpc, port: 8081, targetPort: 8081, appProtocol: grpc }
    - { name: debug, port: 6070, targetPort: 6070 }
