# Two APIs on one host, split by path (ADR-0005): orders in team-a-dev, payments in team-a-test.
# go-httpbin echoes the request at /anything, so a check sees what reached the backend.
apiVersion: apps/v1
kind: Deployment
metadata: { name: orders, namespace: team-a-dev }
spec:
  selector: { matchLabels: { app: orders } }
  template:
    metadata: { labels: { app: orders } }
    spec:
      containers:
        - name: httpbin
          image: ghcr.io/mccutchen/go-httpbin:2.15.0
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /status/200, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /status/200, port: 8080 }, periodSeconds: 5, failureThreshold: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: orders, namespace: team-a-dev }
spec:
  selector: { app: orders }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payments, namespace: team-a-test }
spec:
  selector: { matchLabels: { app: payments } }
  template:
    metadata: { labels: { app: payments } }
    spec:
      containers: [{ name: httpbin, image: ghcr.io/mccutchen/go-httpbin:2.15.0, ports: [{ containerPort: 8080 }] }]
---
apiVersion: v1
kind: Service
metadata: { name: payments, namespace: team-a-test }
spec:
  selector: { app: payments }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api.orders
  namespace: team-a-dev
  labels: { api-gateway.stakater.com/managed: "true" }
  annotations: { api-gateway.stakater.com/api: orders }
spec:
  parentRefs: [{ name: mto-api-gateway, namespace: team-a-dev }]
  hostnames: ["orders.team-a.apis.example.com"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /orders/v2 } }]
      filters:
        - { type: URLRewrite, urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: /anything/orders/v1 } } }
      backendRefs: [{ name: orders, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api.payments
  namespace: team-a-test
  labels: { api-gateway.stakater.com/managed: "true" }
  annotations: { api-gateway.stakater.com/api: payments }
spec:
  parentRefs: [{ name: mto-api-gateway, namespace: team-a-dev }]
  hostnames: ["orders.team-a.apis.example.com"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /payments/v1 } }]
      filters:
        - { type: URLRewrite, urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: /anything/payments/v1 } } }
      backendRefs: [{ name: payments, port: 80 }]
